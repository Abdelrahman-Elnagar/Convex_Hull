<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <!-- Background circle -->
    <circle cx="100" cy="100" r="90" fill="#1a1a1a" stroke="#e01414" stroke-width="4"/>
    
    <!-- Convex hull shape -->
    <polygon points="100,30 160,70 180,130 140,180 60,180 20,130 40,70" 
             fill="none" stroke="#e01414" stroke-width="6"/>
    
    <!-- Points -->
    <circle cx="100" cy="30" r="6" fill="#e01414"/>
    <circle cx="160" cy="70" r="6" fill="#e01414"/>
    <circle cx="180" cy="130" r="6" fill="#e01414"/>
    <circle cx="140" cy="180" r="6" fill="#e01414"/>
    <circle cx="60" cy="180" r="6" fill="#e01414"/>
    <circle cx="20" cy="130" r="6" fill="#e01414"/>
    <circle cx="40" cy="70" r="6" fill="#e01414"/>
    
    <!-- Center point -->
    <circle cx="100" cy="100" r="8" fill="#ffffff"/>
</svg> 